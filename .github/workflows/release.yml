name: Build Firmware & Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Versions match tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) V="${TAG#v}" ;;
            *) echo "not a version tag ($TAG) — skipping"; exit 0 ;;
          esac
          MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          WANT_NUM=$(printf '0x%02d%02d%02d' "$MAJOR" "$MINOR" "$PATCH")

          FW=$(sed -n 's/.*#define FW_VERSION  *"\([0-9.]*\)".*/\1/p' src/protocol.h)
          FWNUM=$(sed -n 's/.*#define FW_VERSION_NUM  *\(0x[0-9a-fA-F]*\).*/\1/p' src/protocol.h)
          PUB=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' companion/pubspec.yaml)
          APP=$(sed -n "s/.*appVersion = '\([0-9.]*\)'.*/\1/p" companion/lib/features/config/device_config.dart)
          WEB=$(sed -n 's/.*<div class="version">v\([0-9.]*\)<\/div>.*/\1/p' docs/index.html)

          rc=0
          check() { [ "$2" = "$3" ] || { echo "::error::$1 is '$2', tag wants '$3'"; rc=1; }; }
          check "src/protocol.h FW_VERSION"          "$FW"    "$V"
          check "src/protocol.h FW_VERSION_NUM"      "$FWNUM" "$WANT_NUM"
          check "companion/pubspec.yaml"             "$PUB"   "$V"
          check "device_config.dart appVersion"      "$APP"   "$V"
          check "docs/index.html flasher version"    "$WEB"   "$V"
          [ $rc -eq 0 ] && echo "all version sources = $V"
          exit $rc

  build-firmware:
    name: Firmware (${{ matrix.role }}-${{ matrix.board }})
    needs: [version-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: v3_app_controlled
            role: node
            board: xiao_s3
            chip: esp32s3
          - env: v3_app_controlled_s3_devkitc
            role: node
            board: s3_devkitc
            chip: esp32s3
          - env: v3_app_controlled_c5
            role: node
            board: xiao_c5
            chip: esp32c5
          - env: v3_node_manager_wroom
            role: mgr
            board: wroom
            chip: esp32
          - env: v3_node_manager_xiao_c3
            role: mgr
            board: xiao_c3
            chip: esp32c3
          - env: v3_node_manager_s3
            role: mgr
            board: xiao_s3
            chip: esp32s3
          - env: v3_node_manager_s3_devkitc
            role: mgr
            board: s3_devkitc
            chip: esp32s3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      - name: Package firmware
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          ROLE="${{ matrix.role }}"
          BOARD="${{ matrix.board }}"
          ENV="${{ matrix.env }}"
          STEM="oui-spy-${ROLE}-${BOARD}-${VERSION}"
          mkdir -p dist
          cp ".pio/build/${ENV}/firmware.bin"   "dist/${STEM}.bin"
          cp ".pio/build/${ENV}/bootloader.bin" "dist/${STEM}-bootloader.bin"
          cp ".pio/build/${ENV}/partitions.bin" "dist/${STEM}-partitions.bin"
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" -path "*/partitions/*" | head -1)
          cp "$BOOT_APP0" "dist/${STEM}-boot_app0.bin"
          (cd dist && tar czf "../${STEM}-usb.tar.gz" \
            "${STEM}-bootloader.bin" "${STEM}-partitions.bin" "${STEM}.bin" "${STEM}-boot_app0.bin")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.role }}-${{ matrix.board }}
          path: |
            dist/oui-spy-*.bin
            oui-spy-*-usb.tar.gz

  publish-flasher:
    name: Refresh web flasher bins
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: companion

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Copy release bins into docs/firmware
        run: |
          VERSION="${GITHUB_REF_NAME}"
          for pair in node:xiao_s3 node:s3_devkitc node:xiao_c5 \
                      mgr:xiao_s3 mgr:s3_devkitc mgr:xiao_c3 mgr:wroom; do
            ROLE="${pair%%:*}"; BOARD="${pair##*:}"
            STEM="oui-spy-${ROLE}-${BOARD}-${VERSION}"
            DEST="docs/firmware/${ROLE}-${BOARD}"
            mkdir -p "$DEST"
            for part in "":firmware "-bootloader":bootloader "-partitions":partitions "-boot_app0":boot_app0; do
              SUF="${part%%:*}"; OUT="${part##*:}"
              SRC=$(find artifacts -type f -name "${STEM}${SUF}.bin" | head -1)
              if [ -z "$SRC" ]; then
                echo "::error::missing ${STEM}${SUF}.bin"
                exit 1
              fi
              cp "$SRC" "${DEST}/${OUT}.bin"
            done
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware
          if git diff --cached --quiet; then
            echo "flasher bins already current"
            exit 0
          fi
          git commit -m "chore: web flasher bins ${GITHUB_REF_NAME}"
          git push origin HEAD:companion

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          draft: true
          generate_release_notes: false
          body: |
            ## OUI-SPY ${{ github.ref_name }}

            > [!NOTE]
            > Early beta — file bugs in Issues.

            ### Firmware

            Companion app picks the matching `.bin` automatically by board + role over BLE DFU.

            | Target | Role | OTA asset | First flash (USB) |
            |--------|------|-----------|-------------------|
            | XIAO ESP32-S3 | node | `oui-spy-node-xiao_s3-${{ github.ref_name }}.bin` | `oui-spy-node-xiao_s3-${{ github.ref_name }}-usb.tar.gz` |
            | ESP32-S3 N16R8 DevKitC | node | `oui-spy-node-s3_devkitc-${{ github.ref_name }}.bin` | `oui-spy-node-s3_devkitc-${{ github.ref_name }}-usb.tar.gz` |
            | XIAO ESP32-C5 (dual-band 2.4+5GHz) | node | `oui-spy-node-xiao_c5-${{ github.ref_name }}.bin` | `oui-spy-node-xiao_c5-${{ github.ref_name }}-usb.tar.gz` |
            | ESP32 WROOM   | mgr  | `oui-spy-mgr-wroom-${{ github.ref_name }}.bin`   | `oui-spy-mgr-wroom-${{ github.ref_name }}-usb.tar.gz` |
            | XIAO ESP32-S3 (recommended) | mgr  | `oui-spy-mgr-xiao_s3-${{ github.ref_name }}.bin` | `oui-spy-mgr-xiao_s3-${{ github.ref_name }}-usb.tar.gz` |
            | ESP32-S3 N16R8 DevKitC | mgr  | `oui-spy-mgr-s3_devkitc-${{ github.ref_name }}.bin` | `oui-spy-mgr-s3_devkitc-${{ github.ref_name }}-usb.tar.gz` |
            | XIAO ESP32-C3 | mgr  | `oui-spy-mgr-xiao_c3-${{ github.ref_name }}.bin` | `oui-spy-mgr-xiao_c3-${{ github.ref_name }}-usb.tar.gz` |

            First-time flash on bare board: extract `*-usb.tar.gz` and use webflasher or esptool.

            - Web flasher: https://lukeswitz.github.io/oui-spy-unified-blue/

            ### Companion App

            | Platform | File | Instructions |
            |----------|------|--------------|
            | **Android** | `oui-spy-${{ github.ref_name }}.apk` | Download signed APK, tap to install. |
            | **macOS** | `oui-spy-macos-${{ github.ref_name }}.zip` | Extract, move `.app` to Applications, run. Signed with Developer ID. |
            | **iOS** | [TestFlight](https://testflight.apple.com/join/5RCKgnJ2) | Join beta via TestFlight. |

            ### Requirements
            - Boards: XIAO ESP32-S3 or ESP32-S3 N16R8 DevKitC (node); XIAO ESP32-S3 (recommended), ESP32-S3 N16R8 DevKitC, XIAO ESP32-C3, or ESP32 WROOM (manager)
            - BLE-capable phone/computer
            - GPS/Location for wardriving

            **Full Changelog**: https://github.com/lukeswitz/oui-spy-unified-blue/compare/<PREVIOUS_TAG>...${{ github.ref_name }}
          files: |
            artifacts/**/*.bin
            artifacts/**/*.tar.gz
